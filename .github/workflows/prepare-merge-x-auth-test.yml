name: Prepare merge branch (x-auth-test -> main)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch x-auth-test
        run: |
          git fetch origin x-auth-test:refs/remotes/origin/x-auth-test

      - name: Create merge branch and merge unrelated histories
        run: |
          git switch -c merge/x-auth-test-into-main origin/main
          git merge --no-ff --allow-unrelated-histories origin/x-auth-test -m "Merge x-auth-test into main"

      - name: Push merge branch
        run: |
          git push -u origin HEAD:merge/x-auth-test-into-main
